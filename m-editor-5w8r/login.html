<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>Editor Portal - Memorio</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/normalize.css" rel="stylesheet" type="text/css">
  <link href="../css/webflow.css" rel="stylesheet" type="text/css">
  <link href="../css/memorio-forms.webflow.css" rel="stylesheet" type="text/css">
  <link href="../images/favicon.png" rel="shortcut icon" type="image/x-icon">
  <link href="../images/webclip.png" rel="apple-touch-icon">
  
  <!-- i18n System -->
  <script src="../js/i18n.js"></script>
  
  <style>
    :root {
      --paper: #fffbf7;
      --cream: #fff3e9;
      --sand: #f4e8de;
      --ink: #32343a;
      --ink-soft: #565a63;
      --slate: #436481;
      --slate-deep: #38536b;
      --slate-dark: #2c4459;
      --sky: #6ca7d3;
    }

    body.body {
      background-color: var(--paper);
      font-family: 'Public Sans', Arial, sans-serif;
      color: var(--ink);
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px;
    }

    .login-box {
      background-color: var(--cream);
      border: 1px solid rgba(67, 100, 129, 0.18);
      border-radius: 12px;
      padding: 48px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 24px -12px rgba(44, 68, 89, 0.18);
    }

    .login-title {
      color: var(--ink);
      text-align: center;
      font-family: 'Newsreader', Georgia, serif;
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .login-subtitle {
      color: var(--ink-soft);
      text-align: center;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .error-message {
      background-color: #fbe9e6;
      border: 1px solid rgba(163, 59, 46, 0.35);
      color: #a33b2e;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message {
      background-color: #e7f3ec;
      border: 1px solid rgba(29, 107, 69, 0.35);
      color: #1d6b45;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(67, 100, 129, 0.35);
      border-radius: 8px;
      font-size: 16px;
      font-family: 'Public Sans', Arial, sans-serif;
      background-color: #ffffff;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--slate);
      box-shadow: 0 0 0 3px rgba(108, 167, 211, 0.25);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: var(--slate);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Public Sans', Arial, sans-serif;
      transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover {
      background-color: var(--slate-deep);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -10px rgba(44, 68, 89, 0.45);
    }

    .btn-login:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .help-text {
      text-align: center;
      color: var(--ink-soft);
      font-size: 14px;
      margin-top: 20px;
    }
  </style>
  
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="body">
  <!-- Nav -->
  <div class="nav">
    <div class="logo-wrapper">
      <img src="../images/Screenshot_2025-03-29_at_6.43.40_PM-removebg-preview.png" 
           loading="lazy" 
           width="166" 
           alt="Memorio Logo" 
           srcset="../images/Screenshot_2025-03-29_at_6.43.40_PM-removebg-preview-p-500.png 500w, ../images/Screenshot_2025-03-29_at_6.43.40_PM-removebg-preview-p-800.png 800w, ../images/Screenshot_2025-03-29_at_6.43.40_PM-removebg-preview.png 838w">
    </div>
  </div>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-box">
      <h1 class="login-title" data-i18n="editor.loginTitle">Video Editor Portal</h1>
      <p class="login-subtitle" data-i18n="editor.loginSubtitle">Sign in to create memorial tribute videos</p>
      
      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email" data-i18n="common.emailAddress">Email Address</label>
          <input type="email" 
                 id="email" 
                 class="form-input" 
                 data-i18n-placeholder="common.enterEmail"
                 placeholder="Enter your email"
                 required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password" data-i18n="common.password">Password</label>
          <input type="password" 
                 id="password" 
                 class="form-input" 
                 data-i18n-placeholder="common.enterPassword"
                 placeholder="Enter your password"
                 required>
        </div>
        
        <button type="submit" class="btn-login" id="loginBtn" data-i18n="editor.signIn">
          Sign In
        </button>
      </form>
      
      <p class="help-text">
        <span data-i18n="editor.noCredentials">Don't have login credentials?</span><br>
        <span data-i18n="editor.contactAdmin">Contact your admin for access.</span>
      </p>
    </div>
  </div>

  <script>
    // Initialize Supabase client
    const SUPABASE_URL = 'https://gkabtvqwwuvigcdubwyv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrYWJ0dnF3d3V2aWdjZHVid3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk5MDE5MjUsImV4cCI6MjA3NTQ3NzkyNX0.O1DfOR5FBm6r3Pg-tjEE5CkzRr3WlWqGU1xUYKrhtnU';
    
    const { createClient } = supabase;
    
    // Initialize Supabase client with proper session persistence (matching dashboard)
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true,
        storage: window.localStorage,
        storageKey: 'memorio-editor-auth', // Must match dashboard
      }
    });
    
    // ============================================================================
    // RATE LIMITING SYSTEM
    // ============================================================================
    // Prevents brute force attacks by limiting failed login attempts
    
    function checkRateLimit(email) {
      const storageKey = `login_attempts_${email}`;
      const attemptData = localStorage.getItem(storageKey);
      
      if (!attemptData) return { allowed: true };
      
      const { count, lastAttempt, lockedUntil } = JSON.parse(attemptData);
      const now = Date.now();
      
      // Check if currently locked out
      if (lockedUntil && now < lockedUntil) {
        const remainingMinutes = Math.ceil((lockedUntil - now) / 60000);
        return {
          allowed: false,
          message: `Too many failed attempts. Please try again in ${remainingMinutes} minute${remainingMinutes > 1 ? 's' : ''}.`
        };
      }
      
      // Reset if last attempt was more than 1 hour ago
      if (now - lastAttempt > 3600000) {
        localStorage.removeItem(storageKey);
        return { allowed: true };
      }
      
      return { allowed: true };
    }
    
    function recordFailedAttempt(email) {
      const storageKey = `login_attempts_${email}`;
      const attemptData = localStorage.getItem(storageKey);
      const now = Date.now();
      
      let count = 1;
      if (attemptData) {
        const parsed = JSON.parse(attemptData);
        count = parsed.count + 1;
      }
      
      // Progressive lockout periods
      let lockedUntil = null;
      if (count >= 10) {
        lockedUntil = now + 30 * 60000; // 30 minutes
      } else if (count >= 5) {
        lockedUntil = now + 5 * 60000; // 5 minutes
      } else if (count >= 3) {
        lockedUntil = now + 1 * 60000; // 1 minute
      }
      
      localStorage.setItem(storageKey, JSON.stringify({
        count,
        lastAttempt: now,
        lockedUntil
      }));
    }
    
    function clearRateLimit(email) {
      const storageKey = `login_attempts_${email}`;
      localStorage.removeItem(storageKey);
    }
    
    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      
      // Hide previous messages
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
      
      // Check rate limiting
      const rateCheck = checkRateLimit(email);
      if (!rateCheck.allowed) {
        errorMessage.textContent = rateCheck.message;
        errorMessage.style.display = 'block';
        return;
      }
      
      // Disable button and show loading
      loginBtn.disabled = true;
      loginBtn.textContent = i18n.t('editor.signingIn');
      
      try {
        // Call server-side rate-limited login Edge Function
        const response = await fetch(`${SUPABASE_URL}/functions/v1/rate-limited-login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({
            email: email,
            password: password,
            expectedRole: 'editor'
          })
        });
        
        const result = await response.json();
        
        // Handle rate limiting (429)
        if (response.status === 429) {
          throw new Error(result.message || i18n.t('common.rateLimitExceeded').replace('{minutes}', '15'));
        }
        
        // Handle authentication errors
        if (!response.ok) {
          throw new Error(result.message || i18n.t('common.loginFailed'));
        }
        
        // Success! Session is automatically set by Supabase
        // Store session manually if needed
        if (result.session) {
          await supabaseClient.auth.setSession(result.session);
        }
        
        // Success - redirect to dashboard
        successMessage.textContent = i18n.t('editor.loginSuccess');
        successMessage.style.display = 'block';
        
        setTimeout(() => {
          window.location.href = '/editor/dashboard';
        }, 1000);
        
      } catch (error) {
        console.error('Login error:', error);
        
        errorMessage.textContent = error.message || i18n.t('common.loginFailed');
        errorMessage.style.display = 'block';
        
        // Re-enable button
        loginBtn.disabled = false;
        loginBtn.textContent = i18n.t('editor.signIn');
      }
    });
  </script>
</body>
</html>
